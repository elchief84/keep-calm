[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-calm"
version = "0.1.0"
description = "Lightweight, privacy-first AI model for pre-send communication analysis"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Keep Calm contributors"}
]
keywords = ["nlp", "communication", "privacy", "toxicity", "emotion", "sentiment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
training = [
    "pytorch-lightning>=2.1",
    "wandb>=0.16",
    "datasets>=2.18",
]

[project.scripts]
keep-calm = "keep_calm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E701", "E702", "E722", "E741", "B905", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
