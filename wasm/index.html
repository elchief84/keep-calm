<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keep Calm — in-browser demo</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    textarea { width: 100%; height: 120px; padding: 12px; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
    #output { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; }
    #status { color: #888; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>🧘 Keep Calm</h1>
  <p class="sub">Think twice. Send once. — running 100% in your browser.</p>

  <p id="status">Loading ...</p>

  <textarea id="input" placeholder="Type or paste a message ..."></textarea>
  <button id="analyze" disabled>Analyze</button>

  <div id="output"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
